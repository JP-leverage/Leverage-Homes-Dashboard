name: STL Slack Ping

on:
  schedule:
    - cron: "0 0,15,16,17,18,19,20,21,22,23 * * 1-6"
  workflow_dispatch: {}

concurrency:
  group: stl-slack-ping
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CHANNELS: "C0B7CC71C3V,C0B7FBV863X,C0B81RLDBRB"
      PAGES_URL: "https://jp-leverage.github.io/Leverage-Homes-Dashboard/?view=stl-embed&period=today"
    steps:
      - name: Gate to Eastern window (DST-safe)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run - bypassing time gate."
            echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          export TZ="America/New_York"
          DOW=$(date +%u)
          HOUR=$(date +%-H)
          echo "Eastern now: $(date)  (DOW=$DOW HOUR=$HOUR)"
          if [ "$DOW" -ge 1 ] && [ "$DOW" -le 5 ] && [ "$HOUR" -ge 11 ] && [ "$HOUR" -le 19 ]; then
            echo "In window - proceeding."
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "Outside 11am-7pm ET Mon-Fri - skipping."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.gate.outputs.go == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        if: steps.gate.outputs.go == 'true'
        working-directory: scripts
        run: npm ci || npm install

      - name: Screenshot dashboard and post to Slack
        if: steps.gate.outputs.go == 'true'
        working-directory: scripts
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: node stl-slack-ping.mjs
